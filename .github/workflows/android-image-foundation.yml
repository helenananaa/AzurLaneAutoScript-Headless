name: android-image-foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux-portable-foundation-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements/android-image-foundation.txt
      - name: Compile Python entrypoints
        run: python -m compileall -q python scripts/python
      - name: Parse Redroid build entrypoint
        run: bash -n scripts/wsl/build-redroid-images.sh scripts/wsl/package-redroid-oci.sh scripts/wsl/qualify-redroid-image-rollback.sh
      - name: Validate image policy
        env:
          PYTHONPATH: python
        run: python scripts/python/validate_android_image_policy.py --policy integration/runtime/android-image-policy.example.json
      - name: Validate immutable image source lock
        env:
          PYTHONPATH: python
        run: python scripts/python/validate_android_image_source_lock.py --source-lock integration/runtime/android-image-source-lock.example.json
      - name: Materialize pinned ALAS test source
        shell: bash
        run: |
          upstream_commit="$(python -c 'import json; print(json.load(open("integration/alas/upstream-lock.json", encoding="utf-8"))["commit"])')"
          upstream_root="${GITHUB_WORKSPACE%/*}/AzurLaneAutoScript-upstream-readonly"
          git -C "${GITHUB_WORKSPACE%/*}" init AzurLaneAutoScript-upstream-readonly
          git -C "$upstream_root" remote add origin https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git -C "$upstream_root" -c protocol.version=2 fetch --depth=1 --filter=blob:none origin "$upstream_commit"
          git -C "$upstream_root" checkout --detach FETCH_HEAD
          test "$(git -C "$upstream_root" rev-parse HEAD)" = "$upstream_commit"
      - name: Run portable repository tests
        env:
          PYTHONPATH: python
        run: >-
          python -m pytest -q tests
          --ignore=tests/test_alas_event_task_live_validation.py
      - name: Reject tracked proprietary Android artifacts
        shell: bash
        run: |
          if git ls-files '*.apk' '*.aab' '*.apks' '*.obb' | grep -q .; then
            echo 'Android package/resource artifacts must remain external to Git.' >&2
            exit 1
          fi

  windows-full-repository-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r .github/requirements/android-image-foundation.txt
      - name: Compile Python entrypoints
        run: python -m compileall -q python scripts/python
      - name: Materialize pinned ALAS test source
        shell: pwsh
        run: |
          $lock = Get-Content -Raw integration/alas/upstream-lock.json | ConvertFrom-Json
          $upstreamCommit = $lock.commit
          $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
          $upstreamRoot = Join-Path $parent 'AzurLaneAutoScript-upstream-readonly'
          New-Item -ItemType Directory -Path $upstreamRoot | Out-Null
          git -C $upstreamRoot init
          git -C $upstreamRoot remote add origin https://github.com/LmeSzinc/AzurLaneAutoScript.git
          git -C $upstreamRoot -c protocol.version=2 fetch --depth=1 --filter=blob:none origin $upstreamCommit
          git -C $upstreamRoot checkout --detach FETCH_HEAD
          $actualCommit = (git -C $upstreamRoot rev-parse HEAD).Trim()
          if ($actualCommit -ne $upstreamCommit) {
            throw "Pinned ALAS checkout mismatch: expected $upstreamCommit, got $actualCommit"
          }
      - name: Run full repository tests
        env:
          PYTHONPATH: python
        run: python -m pytest -q tests
